name: Build SinoBuilderAI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sino_builder_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: |
         flutter clean
         flutter pub get

      - name: Build APK
        run: |
         flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SinoBuilderAI-APK
          path: sino_builder_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Build Info
        run: |
          mkdir -p release
          echo "BUILD_STATUS=SUCCESS" > release/build.env
          echo "APK_PATH=build/app/outputs/flutter-apk/app-release.apk" >> release/build.env

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: BuildInfo
          path: sino_builder_app/release/build.env
